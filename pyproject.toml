[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lithology-probabilistic-unet"
version = "0.1.0"
description = "Well-held-out lithology classification with tree and probabilistic 1D U-Net baselines"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "torch>=2.2",
  "xgboost>=2.0", "matplotlib>=3.8", "seaborn>=0.13",
  "joblib>=1.3", "pyyaml>=6.0"
]

[project.scripts]
lithology-unet = "lithology_unet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
